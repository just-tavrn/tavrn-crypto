# SPDX-License-Identifier: MPL-2.0
#
# gitleaks configuration: the default rules, minus known false positives. The protocol's test vectors
# (submodule protocol/) contain keys derived from fixed, published seeds so that every implementation can
# reproduce them; Cargo.lock lists crate names such as "libcrux-secrets"; the package tests use fixed ULIDs
# and the base64 of "credential-1" as a passkey id. None of them protect anything. Every other file is
# scanned with the default rules.
title = "tavrn-crypto"

[extend]
useDefault = true

[[allowlists]]
description = "Deterministic test vectors (fixed published seeds) and the lockfile"
paths = ['''^protocol/testvectors/[^/]+\.json$''', '''^Cargo\.lock$''']

[[allowlists]]
description = "Fixed test identifiers in the package tests"
regexTarget = "secret"
regexes = ['''^01J9ZK3G5M8Q2W4E6R8T0Y2V[0-9A-Z]{2}$''', '''^Y3JlZGVudGlhbC0x$''']
