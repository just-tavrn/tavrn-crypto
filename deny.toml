# cargo deny configuration. `cargo deny check` runs in the CI and in `just check`.

[graph]
all-features = true
# The WebAssembly dependencies (wasm-bindgen, js-sys, getrandom/js) are only pulled in for wasm32: check
# both the native and the WebAssembly graph.
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc", "wasm32-unknown-unknown"]

[licenses]
# Explicit allow-list: permissive licenses and MPL-2.0 (file-level copyleft, compatible with this crate's
# license). No (A)GPL/LGPL: the crypto core is embedded in clients, bots and apps under other licenses and
# must stay free of it.
allow = [
    "MIT",
    "MIT-0",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "BSL-1.0",
]
confidence-threshold = 0.93
# The list is the project-wide allow-list (also for future dependencies); entries nobody uses today are fine.
unused-allowed-license = "allow"

[advisories]
yanked = "deny"
ignore = [
    # proc-macro-error2 is unmaintained: a build-time macro crate via openmls_rust_crypto -> hpke-rs -> libcrux,
    # not part of the runtime code. Accepted until OpenMLS moves (same entry as in tavrn-node).
    { id = "RUSTSEC-2026-0173", reason = "unmaintained build-time macro crate deep in the OpenMLS stack" },
    # Owner-approved temporary exception, tracked in https://github.com/just-tavrn/tavrn-crypto/issues/24.
    { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5.5 only: elliptic-curve 0.13 <- p256/p384/k256/ecdsa 0.13 <- openmls_rust_crypto 0.6 / hpke-rs-rust-crypto 0.7; tavrn uses only MLS suite 0x0001 (X25519/Ed25519), NIST curves only verify public data; tracking https://github.com/just-tavrn/tavrn-crypto/issues/24; expires 2026-12-26" },
]

[bans]
multiple-versions = "warn"
deny = [
    # cargo-deny ignores match the advisory ID for every version: keep the affected crypto-bigint 0.6/0.7 out.
    # The version requirement needs the `name:req` form; `name@req` silently matches no range (cargo-deny 0.20.2).
    { crate = "crypto-bigint:>=0.6.0, <0.7.6", reason = "RUSTSEC-2026-0387: affected versions; the advisory ignore (tavrn-crypto#24) is meant for 0.5.5 only" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
