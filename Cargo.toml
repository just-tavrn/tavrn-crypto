[package]
name = "tavrn-crypto"
version = "0.1.0"
description = "tavrn end-to-end encryption core (OpenMLS-based MLS client, key derivation, sealed boxes), shared by all clients and the bot SDK"
license = "MPL-2.0"
edition = "2024"
# OpenMLS 0.9 requires Rust 1.91.
rust-version = "1.91"
repository = "https://github.com/just-tavrn/tavrn-crypto"
readme = "README.md"
keywords = ["mls", "openmls", "e2ee", "encryption", "tavrn"]
categories = ["cryptography", "wasm"]
# The crate tarball carries the sources and the license; the protocol submodule (test vectors, used by the
# unit tests only) and the npm package stay in the repository.
include = ["/src/**", "/tests/**", "/Cargo.toml", "/LICENSE", "/README.md"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = "0.9"
openmls_rust_crypto = "0.6"
openmls_traits = "0.6"
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
hkdf = "0.13"
sha2 = "0.11"
aes-gcm = { version = "0.10", features = ["zeroize"] }
base64 = { version = "0.23", default-features = false, features = ["std"] }
bip39 = { version = "3", default-features = false, features = ["std"] }
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RFC 8785 (JCS) for plaintext message signatures (FEDERATION.md §10.3)
serde_json_canonicalizer = "0.3"
thiserror = "2"
crypto_box = { version = "0.9", default-features = false, features = ["seal", "salsa20", "getrandom"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
openmls = { version = "0.9", features = ["js"] }
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"

# Debug builds keep only line tables (backtraces still show file:line): full DWARF makes the test binaries
# very large. The hash and curve crates are optimized in the dev profile too, otherwise the tests are slow.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3

# WebAssembly build (build-wasm.sh): small and fully optimized.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
strip = true
