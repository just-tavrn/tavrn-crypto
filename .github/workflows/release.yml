# SPDX-License-Identifier: MPL-2.0
#
# Release of tavrn-crypto and @tavrn/crypto (docs/GITHUB.md, README.md "Releases").
# - Push a tag vX.Y.Z whose commit carries the built pkg/dist (only organization owners may create v* tags): `build`
#   tests the committed package, packs the .crate and the npm tarball and runs the publication dry runs, without any
#   publishing credential; `release` attaches both to a GitHub release; `publish` (environment `release`: tags v*, the
#   owner's approval; repository variable PUBLISH_ENABLED; secrets CARGO_REGISTRY_TOKEN and NPM_TOKEN of the
#   environment) publishes them. `publish` installs nothing and runs no code of the repository: npm publishes the
#   tarball of `build` after comparing it with `npm pack --ignore-scripts` of the tag, and `cargo publish --no-verify`
#   uploads the crate packaged from the tag after checking that it is the crate `build` tested (no build script or
#   macro runs).
# - Run the workflow by hand with a version to prepare a release: it builds pkg/dist from main, tests it and uploads
#   it as the artifact pkg-dist; commit it, tag the commit and push the tag (a workflow token cannot create v* tags).
# Gated by CI_ENABLED.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v (Cargo.toml and pkg/package.json on main must already carry it)"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build and test
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          persist-credentials: false
      - name: Protocol submodule (test vectors)
        env:
          READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}
        run: |
          if [ -n "$READ_TOKEN" ]; then
            git -c "url.https://x-access-token:${READ_TOKEN}@github.com/just-tavrn/.insteadOf=https://github.com/just-tavrn/" submodule update --init protocol
          else
            git submodule update --init protocol
          fi
      - name: Determine the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT" = workflow_dispatch ]; then v="$INPUT_VERSION"; else v="${GITHUB_REF_NAME#v}"; fi
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          npm=$(node -p 'require("./pkg/package.json").version')
          if [ "$crate" != "$v" ] || [ "$npm" != "$v" ]; then
            echo "version mismatch: release $v, Cargo.toml $crate, pkg/package.json $npm" >&2
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - name: Build pkg/dist (manual run only; a pushed tag carries its own build)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: ./build-wasm.sh
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No Actions cache for the pnpm store in a release build.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: cargo test --locked
      - name: Test the package that is released
        run: |
          test -f pkg/dist/tavrn_crypto_bg.wasm
          pnpm -r typecheck
          pnpm -r test
      - name: pkg/dist for the release commit (manual run)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pkg-dist
          path: pkg/dist/
          retention-days: 7
      - name: Package (crate and npm tarball)
        if: ${{ github.event_name == 'push' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          cargo package --locked --allow-dirty
          cp "${CARGO_TARGET_DIR:-target}/package/tavrn-crypto-$VERSION.crate" release/
          (cd pkg && npm pack --pack-destination ../release)
          ls -l release
      - name: Publication dry runs
        if: ${{ github.event_name == 'push' }}
        run: |
          cargo publish --dry-run --locked --allow-dirty
          cd pkg && npm publish --dry-run --access public
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ github.event_name == 'push' }}
        with:
          name: release-packages
          path: release/
          retention-days: 7

  release:
    name: GitHub release
    needs: build
    if: ${{ vars.CI_ENABLED == 'true' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: release
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --title "v$VERSION" --generate-notes \
            --verify-tag release/*.crate release/*.tgz

  publish:
    name: Publish to crates.io and npm
    needs: [build, release]
    if: ${{ vars.CI_ENABLED == 'true' && github.event_name == 'push' && vars.PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      # The tag's sources for `cargo publish` only (crates.io takes no prebuilt .crate); no submodule, no install.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: "${{ runner.temp }}/release"
      - name: The npm tarball to publish holds the tag's files
        env:
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          # pkg/dist is committed on the tag: npm pack without scripts must give the same files.
          mkdir -p "$RUNNER_TEMP/npm-tag" "$RUNNER_TEMP/npm-a" "$RUNNER_TEMP/npm-b"
          (cd pkg && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/npm-tag" >/dev/null)
          tar -xzf "$RELEASE_DIR/tavrn-crypto-$VERSION.tgz" -C "$RUNNER_TEMP/npm-a"
          tar -xzf "$RUNNER_TEMP/npm-tag/tavrn-crypto-$VERSION.tgz" -C "$RUNNER_TEMP/npm-b"
          diff -r "$RUNNER_TEMP/npm-a" "$RUNNER_TEMP/npm-b"
      - name: The crate to publish is the one the build tested
        env:
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          # --no-verify: packaging only, no build script or proc macro runs in this job.
          cargo package --no-verify --locked
          mkdir -p "$RUNNER_TEMP/built" "$RUNNER_TEMP/tested"
          tar -xzf "target/package/tavrn-crypto-$VERSION.crate" -C "$RUNNER_TEMP/built"
          tar -xzf "$RELEASE_DIR/tavrn-crypto-$VERSION.crate" -C "$RUNNER_TEMP/tested"
          diff -r --exclude=.cargo_vcs_info.json "$RUNNER_TEMP/tested" "$RUNNER_TEMP/built"
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          cargo publish --no-verify --locked
          npm publish "$RELEASE_DIR"/tavrn-crypto-"$VERSION".tgz --provenance --access public
