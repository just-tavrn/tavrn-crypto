# SPDX-License-Identifier: MPL-2.0
#
# Uses the organization's reusable workflows (just-tavrn/.github). Every job is gated by the repository
# variable CI_ENABLED (docs/GITHUB.md): nothing runs until the owner sets it to "true".
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Docs-only changes (Markdown, docs/) run the hygiene jobs only; the builds report themselves as skipped
    # (a passed check). The website picks the documentation up through its source submodules.
    name: What changed
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          code=true
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BASE" "$HEAD")"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '(^|/)[^/]+\.md$|^docs/'; then code=false; fi
            printf '%s\n' "$files" | head -100
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  rust:
    name: Rust
    needs: changes
    if: ${{ vars.CI_ENABLED == 'true' }}
    uses: just-tavrn/.github/.github/workflows/rust-ci.yml@main
    with:
      skip: ${{ needs.changes.outputs.code != 'true' }}
      runner: tavrn-heavy
      # rustfmt, clippy (native), clippy (wasm32: the bindings in src/wasm.rs), tests incl. the protocol
      # test vectors (submodule protocol/), cargo deny with deny.toml (bans, licenses, sources; the advisories run in
      # advisories.yml).
      extra-targets: wasm32-unknown-unknown
      clippy-args: --all-targets --locked
      extra-clippy: |
        --lib --target wasm32-unknown-unknown --locked
      test-args: --locked
    secrets:
      # The protocol submodule is private until the repositories go public.
      READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}

  wasm:
    name: WebAssembly package
    needs: changes
    if: ${{ vars.CI_ENABLED == 'true' }}
    uses: just-tavrn/.github/.github/workflows/js-ci.yml@main
    with:
      skip: ${{ needs.changes.outputs.code != 'true' }}
      runner: tavrn-heavy
      # Builds a fresh pkg/dist, then SPDX and JS license checks, typecheck and Vitest run against it,
      # followed by the publication dry runs of the crate and the npm tarball.
      rust-wasm: true
      pre-test: ./build-wasm.sh
      typecheck: pnpm -r typecheck
      test: pnpm -r test
      build: |
        cargo publish --dry-run --locked --allow-dirty
        cd pkg && npm pack --dry-run
    secrets:
      READ_TOKEN: ${{ secrets.TAVRN_READ_PAT }}

  publish-check:
    name: Publication hygiene
    if: ${{ vars.CI_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No private files, domains or secrets
        env:
          # Comma-separated private domains, hosts and addresses (repository or organization secret).
          PUBLISH_CHECK_PRIVATE: ${{ secrets.PUBLISH_CHECK_PRIVATE }}
          # Dependabot's pull requests see only Dependabot secrets; the push to main runs the full check.
          PUBLISH_CHECK_ALLOW_UNCONFIGURED: ${{ github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && '1' || '' }}
        run: scripts/publish-check.sh

  shared-scripts:
    # The copies of the organization's shared scripts (SPDX check, publication check, labels, JS licenses) are the
    # source in just-tavrn/.github apart from their SPDX line (its docs/GITHUB.md "Shared scripts").
    if: ${{ vars.CI_ENABLED == 'true' }}
    uses: just-tavrn/.github/.github/workflows/shared-scripts.yml@main
