# SPDX-License-Identifier: MPL-2.0
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      rust:
        patterns: ["*"]
    ignore:
      # Held back until openmls_rust_crypto moves (reason in Cargo.toml).
      - dependency-name: ed25519-dalek
        update-types: ["version-update:semver-major"]
      - dependency-name: aes-gcm
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      javascript:
        patterns: ["*"]
    ignore:
      # TypeScript 7 (the native compiler) ships no compiler API, which @hey-api/openapi-ts in tavrn-js needs;
      # the three JavaScript repositories stay on one TypeScript version and move together (README.md "Tests").
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: gitsubmodule
    directory: /
    schedule: { interval: weekly }
